[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "fs-agent-grok-poc"
version = "0.1.0"
description = "Feishu synthetic PoC with an explicitly pinned local Qwen API"
requires-python = ">=3.12"
dependencies = [
    "lark-oapi==1.7.5",
    "pypdf==6.19.0",
    "python-docx==1.2.0",
]

[project.scripts]
fs-agent = "fs_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fs_agent", "src/am_doc_engine", "src/am_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest==8.4.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "am-conversation"
version = "0.1.0"
description = "Natural conversation and durable work context for the existing AM bot"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
am-conversation = "am_conversation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

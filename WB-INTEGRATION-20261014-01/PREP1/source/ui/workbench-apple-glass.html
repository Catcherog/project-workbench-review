@media(max-width:540px){#cortana-workbench-glass{--pg-pad:16px}#cortana-workbench-glass .pg-window{display:block;min-height:710px}#cortana-workbench-glass .pg-sidebar{padding:12px;border-right:0;border-bottom:1px solid var(--pg-line)}#cortana-workbench-glass .pg-traffic,#cortana-workbench-glass .pg-brand,#cortana-workbench-glass .pg-sidebar-bottom{display:none}#cortana-workbench-glass .pg-nav{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}#cortana-workbench-glass .pg-nav button{padding:8px 3px;gap:5px;justify-content:center;flex-direction:column;font-size:11px;min-height:55px}#cortana-workbench-glass .pg-nav small{display:none}#cortana-workbench-glass .pg-toolbar{height:48px}#cortana-workbench-glass .pg-body{padding-top:22px}#cortana-workbench-glass .pg-row{gap:9px;flex-wrap:wrap}#cortana-workbench-glass .pg-row-title{font-size:14px}#cortana-workbench-glass .pg-row-side{width:100%;display:flex;align-items:center;padding-left:46px;text-align:left;justify-items:start;gap:10px}#cortana-workbench-glass .pg-row-chevron{display:none}#cortana-workbench-glass .pg-project-icon{width:32px;height:32px}#cortana-workbench-glass .pg-nudge{padding:14px}#cortana-workbench-glass .pg-sheet-area{padding:12px 9px 20px}#cortana-workbench-glass .pg-sheet-head{padding:19px 17px 15px}#cortana-workbench-glass .pg-sheet-content{padding:18px 17px}#cortana-workbench-glass h2{font-size:20px}#cortana-workbench-glass .pg-time-fields{grid-template-columns:1fr}#cortana-workbench-glass .pg-batch-footer{align-items:stretch;flex-direction:column}#cortana-workbench-glass .pg-batch-footer small{max-width:100%}#cortana-workbench-glass .pg-heading{margin-bottom:20px}#cortana-workbench-glass .pg-compose-actions{flex-wrap:wrap}#cortana-workbench-glass .pg-message-editor{font-size:14px;width:100%;margin-left:0}#cortana-workbench-glass .pg-message-top{flex-wrap:wrap}#cortana-workbench-glass .pg-message-top label{min-width:170px}#cortana-workbench-glass input[type="date"],#cortana-workbench-glass input[type="time"],#cortana-workbench-glass select,#cortana-workbench-glass textarea{font-size:16px}#cortana-workbench-glass input[type="date"]{width:153px}#cortana-workbench-glass .pg-segment button{padding:6px 9px}#cortana-workbench-glass .pg-tag{white-space:normal}}
@media(pointer:coarse){#cortana-workbench-glass button,#cortana-workbench-glass select{min-height:44px}#cortana-workbench-glass .pg-icon-button{width:44px}#cortana-workbench-glass .pg-link{padding:9px 2px}}
@media(max-width:540px){#cortana-workbench-glass .pg-compose textarea,#cortana-workbench-glass .pg-message-editor{font-size:16px}}
</style>
<script>
(()=>{
const root=document.getElementById('cortana-workbench-glass');
const body=root.querySelector('.pg-body'),sheetArea=root.querySelector('.pg-sheet-area'),win=root.querySelector('.pg-window');
const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=name=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
const button=(text,action,primary=false,extra='')=>`<button type="button" class="pg-button${primary?' pg-primary':''}" data-act="${action}" ${extra}>${text}</button>`;
const tag=(text,tone='neutral')=>`<span class="pg-tag ${tone}">${text}</span>`;
const titles={projects:'项目',risks:'风险',data:'数据',weekly:'周例会',assistant:'助手'};
const initialItems=[
 {id:'test',title:'关键回归测试与评审窗口',project:'北辰驱动器',node:'验证与评审',need:'需要你协调资源',reason:'必要测试预计还需 2 小时，取得评审结论前只剩 1 小时。',next:'核对可用资源，明确本次评审安排',priority:'P1',tone:'amber',check:'2026-10-13',clock:'16:00',due:'2026-10-16',closed:false,progress:'测试负责人反馈：剩余必要测试至少 2 小时，暂未发现可并行方案。',source:'测试负责人 · 10月13日 15:00 · 示例反馈',version:0,history:[],pause:false,manual:false},
 {id:'report',title:'验证报告交付',project:'北辰驱动器',node:'验证与评审',need:'消息待你预览',reason:'报告已有链接，目标节点的关联和“已审核”状态还需补齐。',next:'责任人关联报告并推动审核',priority:'P2',tone:'blue',check:'2026-10-14',clock:'10:00',due:'2026-10-16',closed:false,progress:'责任人已提供报告链接；已整理好适用模板和测试数据入口。',source:'报告责任人 · 10月13日 14:10 · 示例反馈',version:0,history:[],pause:false,manual:false},
 {id:'fixture',title:'测试工装参数确认',project:'微岚执行器',node:'方案验证',need:'等待结果',reason:'已联系责任人，等待明天下午的参数反馈。',next:'等待责任人提供参数反馈',priority:'P2',tone:'neutral',check:'2026-10-14',clock:'16:00',due:'',closed:false,progress:'已联系责任人，当前无需再次协调。',source:'示例用户补记 · 10月13日 11:20 · 示例记录',version:0,history:[],pause:false,manual:false}
];
const initialMessages=[
 {id:'m1',item:'report',project:'北辰驱动器',node:'验证与评审',person:'林夏',role:'报告责任人',channel:'飞书私聊',goal:'关联报告并推动审核',body:'林夏，验证报告链接已收到。请将报告关联到“验证与评审”节点，并推动专业审核；完成后请在对应交付物上选择“已审核”。已有测试数据入口和适用模板已整理在下方。',attachment:'验证报告模板；测试数据入口',selected:true,status:'pending'},
 {id:'m2',item:'test',project:'北辰驱动器',node:'验证与评审',person:'周远',role:'测试数据提供方',channel:'飞书私聊',goal:'补充剩余测试安排',body:'周远，请补充剩余必要测试的预计时长范围、适用条件，以及是否存在可并行的步骤，方便核对评审前的时间窗口。已有进展请直接引用这条消息回复。',attachment:'',selected:true,status:'pending'},
 {id:'m3',item:'fixture',project:'微岚执行器',node:'方案验证',person:'陈禾',role:'资料所有者',channel:'飞书私聊',goal:'申请工装资料访问权限',body:'陈禾，工装参数资料的使用人员目前无法打开文档，请核对并为本次协作所需人员开放适当的查看权限。开放完成后，请回复这条消息。',attachment:'工装参数说明（示例链接）',selected:true,status:'pending'}
];
const initialDecisionMessage={id:'decision-scope',person:'陈禾',role:'资料所有者',channel:'飞书私聊',body:'陈禾，请补充两份工装参数资料各自适用的版本和范围，以便判断本次方案验证应采用哪一份。',attachments:[]};
let state={view:'projects',riskFilter:'active',assistantTab:'chat',project:null,items:structuredClone(initialItems),messages:structuredClone(initialMessages),receipt:null,lastOperation:null,batchOpen:false,batchResult:false,decisionApproved:false,decisionDraft:initialDecisionMessage.body,decisionSelection:{adopt:false,send:false},globalInput:'',globalReply:''};
let sheet=null,originFocus=null,returnScroll=0;
const design={radius:20,glass:71,density:'舒适',failure:'正常结果',appearance:'跟随系统'};
const dateLabel=d=>d?`${Number(d.slice(5,7))}月${Number(d.slice(8,10))}日`:'未提供';
const timeLabel=i=>i.check==='pending'?'明确待定':i.check?`${dateLabel(i.check)} ${i.clock||'10:00'}`:'时间待确认';
const itemById=id=>state.items.find(i=>i.id===id);
let lastPublishedState='';
function persist(){if(window.openai?.setWidgetState){const snapshot={modelContent:{selectedPage:titles[state.view],design,prototypeOnly:true},privateContent:{state}};if(new TextEncoder().encode(JSON.stringify(snapshot)).length>15000)snapshot.privateContent=null;lastPublishedState=JSON.stringify(snapshot);window.openai.setWidgetState(snapshot).catch(()=>{});}}
function hydrate(saved){if(saved?.privateContent?.state?.items&&saved.privateContent.state.items.every(i=>initialItems.some(x=>x.id===i.id)||i.id==='scope'))state={...state,...saved.privateContent.state};if(saved?.modelContent?.design)Object.assign(design,saved.modelContent.design);}
hydrate(window.openai?.widgetState);
window.addEventListener('openai:set_globals',e=>{const incoming=e.detail?.globals?.widgetState;if(incoming&&JSON.stringify(incoming)!==lastPublishedState){hydrate(incoming);render();}});
function growMessage(el){el.style.height='auto';el.style.height=Math.max(80,el.scrollHeight)+'px';el.style.overflow='hidden';}
function icons(){if(typeof lucide!=='undefined')lucide.createIcons({attrs:{width:18,height:18}});root.querySelectorAll('button:not([type])').forEach(b=>b.type='button');root.querySelectorAll('button,summary').forEach(b=>b.classList.add('cursor-interaction'));root.querySelectorAll('.pg-message-editor').forEach(growMessage);}
function heading(title,sub,action=''){return `<div class="pg-heading"><div><h1>${title}</h1><p class="pg-subtitle">${sub}</p></div>${action}</div>`;}
function receiptHtml(){const r=state.receipt;if(!r)return '';return `<div class="pg-receipt ${r.kind||''}" data-receipt role="status">${icon(r.kind==='warn'?'circle-alert':'circle-check')}<div><strong>${escape(r.title)}</strong><p>${escape(r.detail||'')}</p>${r.item?`<div class="pg-links"><button class="pg-link" data-open="${r.item}">查看记录</button>${r.undo?`<button class="pg-link" data-act="undo" data-id="${r.item}">撤销本次操作</button>`:''}${r.noTime?`<button class="pg-link" data-act="set-time" data-id="${r.item}">设置时间</button><button class="pg-link" data-act="pending-time" data-id="${r.item}">目前都待定</button>`:''}</div>`:''}</div><button class="pg-icon-button" data-act="dismiss-receipt" aria-label="收起结果提示">${icon('x')}</button></div>`;}
function itemRow(i){return `<button type="button" class="pg-row" data-open="${i.id}"><span class="pg-project-icon">${icon(i.id==='test'?'clock-3':i.id==='report'?'file-check-2':'clipboard-check')}</span><span class="pg-row-main"><span class="pg-row-title">${escape(i.title)}</span><span class="pg-row-description">${escape(i.project)} · ${escape(i.closed?'已结束，原记录可查':i.next)}</span></span><span class="pg-row-side">${tag(i.closed?'已结束':i.need,i.closed?'green':i.tone)}<span>${i.closed?'跟进已结束':`检查 ${timeLabel(i)}`}</span></span>${icon('chevron-right')}</button>`;}
function projectsView(){if(state.project)return projectDetail();return heading('项目','从当前阶段，看到下一步。')+`<div class="pg-section-label"><span>我的项目与专项</span><span>沿用原有顺序</span></div><div class="pg-list">${[
 ['北辰驱动器','验证阶段 · 下一关口：10月16日 评审','需要协调','amber','box'],
 ['微岚执行器','方案阶段 · 下一关口：10月20日 方案确认','按安排推进','green','component'],
 ['测试工装专项','参数确认 · 下一步：确认适用范围','资料待补','neutral','wrench']
].map((p,index)=>`<button type="button" class="pg-row" data-project="${index}"><span class="pg-project-icon">${icon(p[4])}</span><span class="pg-row-main"><span class="pg-row-title">${p[0]}</span><span class="pg-row-description">${p[1]}</span></span><span class="pg-row-side">${tag(p[2],p[3])}</span>${icon('chevron-right')}</button>`).join('')}</div><div class="pg-nudge">${icon('sparkles')}<div><strong>协作消息已准备好</strong><p>跨项目集中预览，确认后分别发送。</p></div>${button('去助手预览','to-preview')}</div><div class="pg-section-label"><span>最近变化</span></div><p class="pg-muted">验证报告已收到链接，仍需责任人完成关联与审核。</p><div class="pg-footnote">${icon('clock-3')}示例快照：10月13日 15:05 · 仅用于设计讨论</div>`;}
function projectDetail(){const idx=Number(state.project)-1,name=['北辰驱动器','微岚执行器','测试工装专项'][idx];return `<button class="pg-link pg-return-link" data-act="back-projects">${icon('arrow-left')}返回项目</button>`+heading(name,'当前阶段与业务节点保持在同一页。')+`<div class="pg-steps">${['启动','方案','开发','验证','评审'].map((s,j)=>`<button type="button" class="pg-stage ${j===3?'active':''}" data-act="open-node" data-index="${idx}">${s}<small>${j<3?'已完成':j===3?'进行中':'下一关口'}</small></button>${j<4?icon('chevron-right'):''}`).join('')}</div><div class="pg-section-label"><span>当前节点 · 关联事项</span></div><div class="pg-list">${state.items.filter(i=>idx===0?i.project==='北辰驱动器':i.id==='fixture').map(itemRow).join('')}</div><div class="pg-footnote">节点下交付物承载工作；事项处理沿用同一记录。</div>`;}
function riskView(){const tabs=[['active','待跟进'],['verify','待核对'],['closed','已结束']];let filtered=state.items.filter(i=>state.riskFilter==='closed'?i.closed:!i.closed);return heading('风险','先处理当前真正需要介入的事。')+`<div class="pg-segment" role="tablist" aria-label="事项范围">${tabs.map(([id,name])=>`<button type="button" role="tab" aria-selected="${state.riskFilter===id}" data-risk-filter="${id}">${name}</button>`).join('')}</div>${state.riskFilter==='verify'?`<div class="pg-decision"><span class="pg-eyebrow">微岚执行器 · 新候选</span><h3>工装数据适用范围待明确</h3><p class="pg-muted">已有两份参数来源，适用版本尚未统一。资料已保存，是否纳入跟进由你决定。</p><div style="margin-top:16px">${button('查看决定与消息','to-decisions')}</div></div>`:`<div class="pg-list">${filtered.length?filtered.map(itemRow).join(''):'<p class="pg-empty">当前没有已结束事项。</p>'}</div>`}<div class="pg-footnote">事项状态、风险结论与消息结果分别保留。</div>`;}
function dataView(){return heading('数据','原件、来源和读取范围，一处可查。')+`<div class="pg-list">${[
 ['测试进展反馈','北辰驱动器 · 工作消息 · 已关联原事项','完整读取','green','test'],
 ['验证报告与模板入口','北辰驱动器 · 资料链接 · 正文未核验','部分读取','amber','report'],
 ['工装参数说明','微岚执行器 · 文档 · 权限申请已拟好','访问受限','neutral','fixture']
].map(x=>`<button class="pg-row" data-evidence="${x[4]}"><span class="pg-project-icon">${icon('file-text')}</span><span class="pg-row-main"><span class="pg-row-title">${x[0]}</span><span class="pg-row-description">${x[1]}</span></span><span class="pg-row-side">${tag(x[2],x[3])}</span></button>`).join('')}</div><div class="pg-notice">读取受限只表示尚未核实，不据此认定未交付。</div>`;}
function weeklyView(){return heading('周例会','按原有项目顺序，围绕下一关口讨论。')+`<div class="pg-list"><div class="pg-row"><div class="pg-row-main"><span class="pg-eyebrow">北辰驱动器 · 验证阶段</span><h3>评审前的测试窗口需要协调</h3><p class="pg-row-description" style="margin-top:9px">关键进展：测试在进行，报告已有链接。<br>当前卡点：必要测试时间超出有效窗口。<br>待决定：资源协调结果与评审安排。</p></div>${button('查看事项','open-test')}</div><div class="pg-row"><div class="pg-row-main"><span class="pg-eyebrow">微岚执行器 · 方案阶段</span><h3>等待工装参数反馈</h3><p class="pg-row-description" style="margin-top:9px">下一次检查：10月14日 16:00。<br>本次例会无需追加协调。</p></div>${tag('按安排推进','green')}</div></div><div class="pg-footnote">展示来自同一事项记录；讨论本身不改变正式计划。</div>`;}
function assistantView(){return heading('助手','同一个助手，把准备、决定和结果接起来。')+`<div class="pg-segment" role="tablist" aria-label="助手内容">${[['chat','对话'],['preview',`消息预览 ${state.messages.filter(m=>m.status==='pending').length}`],['decisions','待决定']].map(([id,t])=>`<button type="button" role="tab" aria-selected="${state.assistantTab===id}" data-assistant-tab="${id}">${t}</button>`).join('')}</div>`+(state.assistantTab==='preview'?previewView():state.assistantTab==='decisions'?decisionView():chatView());}
function chatView(){return `<div class="pg-assistant-label">${icon('sparkles')}Cortana</div><div class="pg-chat-message"><strong>当前有一件事需要你协调。</strong><p style="margin-top:8px">北辰驱动器的必要测试时间超出评审前窗口。原因、已有反馈和候选处理方向已经放在原事项里。</p><div style="margin-top:12px">${button('查看当前事项','open-test')}</div></div>${state.globalReply?`<div class="pg-receipt" role="status">${icon('circle-check')}<div><strong>讨论结果</strong><p>${escape(state.globalReply)}</p></div></div>`:''}<form class="pg-compose" data-form="global"><label class="pg-field-label" for="pg-global-input">直接说你的想法</label><textarea id="pg-global-input" placeholder="例如：关键测试这件事，接下来有哪些可选方案？">${escape(state.globalInput)}</textarea><div class="pg-compose-actions"><span class="pg-compose-note">当前范围：项目空间 · 演示对话</span><button type="button" data-act="submit-global" class="pg-button pg-primary">继续对话 ${icon('arrow-up')}</button></div></form>`;}
function previewView(){if(state.batchResult)return batchResultView();if(!state.batchOpen){const groups=[...new Set(state.messages.filter(m=>m.status==='pending').map(m=>m.project))];return `<p class="pg-muted">待预览消息按项目和节点归在一起。进入本批后，每条收件人与正文完整呈现。</p><div class="pg-list" style="margin-top:20px">${groups.length?groups.map(project=>`<button class="pg-row" data-act="open-batch"><span class="pg-project-icon">${icon('messages-square')}</span><span class="pg-row-main"><span class="pg-row-title">${project}</span><span class="pg-row-description">${state.messages.filter(m=>m.status==='pending'&&m.project===project).map(m=>m.goal).join('；')}</span></span><span class="pg-row-side">${state.messages.filter(m=>m.status==='pending'&&m.project===project).length} 条</span>${icon('chevron-right')}</button>`).join(''):'<p class="pg-empty">没有待预览消息。</p>'}</div>${groups.length?`<div style="margin-top:18px">${button('完整预览本批消息','open-batch',true)}</div>`:''}${state.messages.some(m=>m.status!=='pending')?`<div style="margin-top:18px">${button('查看已有处理结果','open-results')}</div>`:''}<details class="pg-quiet-list"><summary>已发送与失效记录</summary><p>仅展示示例处理历史；本原型不会实际发送消息。</p>${state.messages.filter(m=>m.status!=='pending').map(m=>`<p>${m.person} · ${m.goal} · ${statusName(m.status)}</p>`).join('')}</details>`;}

function batchResultView(){const pending=state.messages.filter(m=>m.status==='pending').length;return `<h3>本批处理结果</h3><p class="pg-subtitle">以下为模拟回执。已发送、未发出与结果待核实分别保留。</p><div class="pg-result-stack">${state.messages.filter(m=>m.status!=='pending').map(m=>`<div class="pg-result-row">${icon(m.status==='sent'?'circle-check':m.status==='unknown'?'circle-help':'circle-alert')}<div><strong>${m.person} · ${m.goal}</strong><p>${m.status==='sent'?'模拟发送成功；业务目标继续跟进。':m.status==='failed'?'已核实未发出，可沿用有效批准重试。':m.status==='unknown'?'正在等待核查发送结果，暂不重发。':m.status==='manual'?'你已接手本次操作；系统恢复不会自动重试。':m.status==='cancelled'?'只记录本次取消；后续跟进按当次说明。':'已核实失去发送理由，历史已保留。'}</p>${m.status==='failed'?`<button class="pg-link" data-handoff="${m.id}">这条我来发送</button>`:''}${m.status==='unknown'?`<button class="pg-link" data-query="${m.id}">查询发送结果</button>`:''}${m.status==='manual'?`<button class="pg-link" data-handback="${m.id}">交回助手继续这条</button>`:''}</div>${tag(statusName(m.status),m.status==='sent'?'green':m.status==='unknown'?'amber':'neutral')}</div>`).join('')}</div><div style="margin-top:22px;display:flex;gap:12px;flex-wrap:wrap">${button(pending?`继续预览剩余 ${pending} 条`:'返回消息概览','result-back')}${state.messages.some(m=>m.status==='failed')?button('模拟故障恢复','recover-send'):''}</div>`;}
function decisionView(){
const approved=state.decisionApproved||{},message=approved.message,selection=state.decisionSelection;
const record=approved.sent?`<section class="pg-disclosure" aria-label="已批准消息记录"><h3>已批准消息记录</h3>${message?`<p>${escape(message.person)} · ${escape(message.role)} · ${escape(message.channel)}</p><div class="pg-chat-message" style="white-space:pre-wrap">${escape(message.body)}</div><p>随附资料：${message.attachments.length?message.attachments.map(escape).join('；'):'无'}</p><p>${escape(message.result)} · 原批准内容保留，不重复执行。</p>`:'<p>历史模拟批准未记录完整正文，原内容无法回看；保留已发送状态，不重复执行。</p>'}</section>`:'';

}

function openItem(id,mode='work'){if(!itemById(id))return;originFocus=document.activeElement;returnScroll=window.scrollY;sheet={id,mode,draft:'',check:itemById(id).check==='pending'?'':itemById(id).check,clock:itemById(id).clock,due:itemById(id).due,dirtyTime:false,dirtyDue:false,error:'',answer:'',image:null};renderSheet();icons();window.scrollTo({top:Math.max(0,root.getBoundingClientRect().top+window.scrollY),behavior:'instant'});sheetArea.querySelector('[data-act="close-sheet"]').focus({preventScroll:true});}

function renderSheet(){if(!sheet)return;const i=itemById(sheet.id);sheetArea.hidden=false;body.inert=true;root.querySelector('.pg-sidebar').inert=true;

function evidenceSheet(i){return `<button class="pg-link pg-return-link" data-act="sheet-work">${icon('arrow-left')}返回当前事项</button><span class="pg-eyebrow">原始依据 · 虚构示例</span><div class="pg-chat-message">${escape(i.progress)}</div><p class="pg-muted">${escape(i.source)}</p><div class="pg-notice">原始反馈与系统判断分别保留；本页展示范围仅为此条示例消息。</div>`;}
function historySheet(i){return `${sheet.error?`<div class="pg-inline-warning" role="alert">${escape(sheet.error)}</div>`:''}<button class="pg-link pg-return-link" data-act="sheet-work">${icon('arrow-left')}返回当前事项</button><h3>处理历史</h3>${i.history.length?i.history.map(h=>`<div class="pg-result-row"><div><strong>${escape(h.title)}</strong><p>${escape(h.detail)}</p></div></div>`).join(''):'<p class="pg-muted" style="margin-top:13px">当前只有初始示例记录。</p>'}<div style="margin-top:20px">${button('模拟相关内容后续更新','simulate-conflict')} ${button('撤销此事项上次本地操作','undo',false,`data-id="${i.id}"`)}</div>`;}
function workSheet(i){return `${sheet.error?`<div class="pg-inline-warning" role="alert">${escape(sheet.error)}</div>`:''}${sheet.answer?`<div class="pg-receipt" role="status">${icon('circle-check')}<div><strong>${sheet.saved?'明确内容已保存':'讨论建议 · 尚未采用'}</strong><p>${escape(sheet.answer)}</p></div></div>`:''}<div class="pg-summary"><h3>${i.closed?'本地跟进已结束':escape(i.need)}</h3><p>${escape(i.closed?'原事项、依据与处理历史保留，可以按当前情况重新打开。':i.reason)}</p></div><div class="pg-time-summary"><span>下次检查<strong>${i.closed?'已转入历史':timeLabel(i)}</strong></span><span>完成要求<strong>${i.due==='pending'?'明确待定':dateLabel(i.due)}</strong></span><span>当前步骤<strong>${i.closed?'无后续':escape(i.next)}</strong></span></div><details class="pg-disclosure"><summary>查看依据与读取范围</summary><p>${escape(i.progress)}<br>${escape(i.source)}</p><button class="pg-link" data-act="sheet-evidence">查看原始记录 ${icon('arrow-up-right')}</button></details>${i.closed?`<div class="pg-sheet-actions">${button('重新打开原事项','reopen',true)}<button class="pg-link" data-act="sheet-history">处理历史</button></div>`:`<form class="pg-compose" data-form="item"><label class="pg-field-label" for="pg-item-input">记录进展，或继续讨论</label>${sheet.image?`<div class="pg-file-chip">${sheet.image.url?`<img src="${sheet.image.url}" alt="本次附图预览">`:icon('image')}<span>${escape(sheet.image.name)} · 仅作原型附件展示</span><button type="button" class="pg-link" data-act="remove-image">移除</button></div>`:''}<textarea id="pg-item-input" placeholder="例如：已联系负责人，明天16点再检查。">${escape(sheet.draft)}</textarea><div class="pg-time-fields"><div><label class="pg-field-label" for="pg-check-date">检查时间</label><div class="pg-date-line"><input id="pg-check-date" type="date" value="${sheet.check||''}"><input id="pg-check-time" type="time" aria-label="检查时刻" value="${sheet.clock||''}"></div></div><div><label class="pg-field-label" for="pg-due-date">完成要求</label><div class="pg-date-line"><input id="pg-due-date" type="date" value="${sheet.due==='pending'?'':sheet.due||''}"><button type="button" class="pg-link" data-act="pending-due">${sheet.due==='pending'?'已选待定':'待定'}</button></div></div></div><p class="pg-time-help">检查只选日期时默认 10:00；原有安排未改动就保留。</p><div class="pg-compose-actions"><span><button type="button" class="pg-link" data-act="attach-image">${icon('paperclip')}添加图片</button><input class="pg-image-input" id="pg-image-input" type="file" accept="image/*" aria-label="选择图片"></span><button type="button" data-act="submit-item" class="pg-button pg-primary">提交 ${icon('arrow-up')}</button></div></form><div class="pg-sheet-actions"><button class="pg-link" data-act="sheet-history">${icon('clock-3')}处理历史</button><button class="pg-link" data-act="pause">${i.pause?'恢复常规提醒':'暂停常规提醒'}</button>${i.id==='report'?'<button class="pg-link" data-act="to-preview">预览协作消息</button>':''}</div>${i.pause?'<p class="pg-footnote">常规提醒已暂停，默认下个实际工作日 9:00 恢复；事项跟进仍保留。</p>':''}`}`;}
function readDraft(){if(!sheet)return;sheet.draft=root.querySelector('#pg-item-input')?.value||sheet.draft;}
function saveItem(){if(!sheet)return;readDraft();const i=itemById(sheet.id),s=sheet,text=s.draft.trim();s.error='';s.answer='';s.saved=false;state.receipt=null;body.querySelector('[data-receipt]')?.remove();if(!text&&!s.dirtyTime&&!s.dirtyDue&&!s.image){s.error='输入进展、添加图片，或修改一项时间后再提交。';renderSheet();return;}
if(design.failure==='保存失败'){s.error='模拟保存失败：输入与时间选择已保留，尚未写入。';renderSheet();return;}
if(design.failure==='保存结果未知'){s.error='模拟保存结果未知：正在核查，不重复提交；输入已保留。';renderSheet();return;}
const question=/[?？]|怎么办|你觉得|如何|哪些方案|有什么方案/.test(text),fact=/已联系|已经联系|已问|已经问|已收到|已经收到|已确认|已经确认|已解决|已解除|已完成/.test(text),end=/已解决|已解除/.test(text)&&/无后续|不需要再跟进|无需继续|结束跟进/.test(text);
if(end&&s.dirtyTime&&s.check){s.error='你同时要求结束跟进并设置了新检查时间，请先明确是否还有后续。';renderSheet();return;}
let parsedDate=/明天/.test(text)?'2026-10-14':/周三/.test(text)?'2026-10-14':/周四/.test(text)?'2026-10-15':null;
let parsedClock=/16[点:：]|下午四点/.test(text)?'16:00':/10[点:：]|上午十点/.test(text)?'10:00':null;
if(parsedDate&&s.dirtyTime&&s.check!==parsedDate){s.error=`文字指向 ${dateLabel(parsedDate)}，手动选择为 ${dateLabel(s.check)}。请就地统一这项检查时间；其他输入已保留。`;renderSheet();return;}
if(s.image&&!text){s.answer='图片已保留在原型草稿中。本原型不连接识图模型，实际保存及有来源进展提取留待产品验收。';s.saved=false;renderSheet();return;}
if(question&&!fact&&!s.dirtyTime&&!s.dirtyDue){s.answer='可先核对必要测试能否并行，再比较资源协调与评审安排的可选方案。各方案需要的条件和影响应分别列清；本次讨论未改变任何安排。';s.saved=false;renderSheet();return;}
if(!fact&&!s.dirtyTime&&!s.dirtyDue&&!parsedDate&&!end){s.answer='这份原型仅演示交互，不将任意文字猜成业务操作。可用“已联系负责人，明天16点再检查”体验明确记录，或直接修改下方时间。';s.saved=false;renderSheet();return;}
state.lastOperation={item:i.id,before:structuredClone(i),version:i.version+1};

if(s.dirtyTime){i.check=s.check;i.clock=s.clock||'10:00';}else if(parsedDate){i.check=parsedDate;i.clock=parsedClock||'10:00';}

if(question){s.answer='进展与明确安排已保存。下一步可以先核对资源条件，再准备候选方案；建议尚未采用。';s.saved=true;s.draft='';s.dirtyTime=false;s.dirtyDue=false;render();}else{const id=i.id;closeSheet(false);render();window.scrollTo({top:returnScroll,behavior:'instant'});requestAnimationFrame(()=>root.querySelector(`[data-open="${id}"]`)?.focus({preventScroll:true}));}persist();}
function undo(targetId){const op=state.lastOperation;if(!op||!targetId||op.item!==targetId){if(sheet){sheet.error='当前事项没有可撤销的本地提交；未改动其他事项。';renderSheet();}else{state.receipt={title:'撤销未执行',detail:'撤销目标与本次提交不一致，所有事项保持不变。',kind:'warn'};render();}return;}const i=itemById(targetId);if(!i||i.version!==op.version){if(sheet){sheet.error='整次撤销已阻止：此事项的进展或提醒设置已有后续修改，未撤销任何一部分。';renderSheet();}else{state.receipt={title:'整次撤销已阻止',detail:'相关内容已有后续修改；当前记录保持不变。',kind:'warn',item:targetId};render();}return;}
const history=i.history;Object.assign(i,structuredClone(op.before));i.version=op.version+1;i.history=[{title:'已撤销整次本地操作',detail:'只还原该次相关改动；已发生的外部发送事实保留。'},...history];state.lastOperation=null;state.receipt={title:'本次本地操作已撤销',detail:'相关进展与时间已还原，历史和外部发送事实保留。',item:i.id};closeSheet(false);render();persist();}
root.addEventListener('input',e=>{const el=e.target;if(sheet&&el.id==='pg-item-input')sheet.draft=el.value;if(el.dataset.msgBody){const m=state.messages.find(x=>x.id===el.dataset.msgBody);m.body=el.value;}if(el.id==='pg-decision-message'){state.decisionDraft=el.value;persist();}if(el.classList.contains('pg-message-editor'))growMessage(el);if(el.id==='pg-global-input')state.globalInput=el.value;});
root.addEventListener('change',e=>{const el=e.target;if(el.id==='pg-approve-item'){state.decisionSelection.adopt=el.checked;persist();}if(el.id==='pg-approve-message'){state.decisionSelection.send=el.checked;persist();}if(sheet){if(el.id==='pg-check-date'){sheet.check=el.value;sheet.dirtyTime=true;}if(el.id==='pg-check-time'){sheet.clock=el.value;sheet.dirtyTime=true;}if(el.id==='pg-due-date'){sheet.due=el.value;sheet.dirtyDue=true;}if(el.id==='pg-image-input'&&el.files?.[0]){readDraft();const file=el.files[0];if(file.size>5*1024*1024){sheet.error='原型仅展示 5 MB 以内的图片；未上传文件。';renderSheet();return;}const reader=new FileReader();reader.onload=()=>{if(sheet){sheet.image={name:file.name,url:reader.result};renderSheet();}};reader.readAsDataURL(file);}}
if(el.dataset.msgCheck){state.messages.find(m=>m.id===el.dataset.msgCheck).selected=el.checked;const count=state.messages.filter(m=>m.status==='pending'&&m.selected).length;root.querySelector('.pg-selected-total').textContent=count;root.querySelector('[data-act="send-batch"]').disabled=!count;persist();}});
root.addEventListener('submit',e=>{e.preventDefault();if(e.target.dataset.form==='item')saveItem();if(e.target.dataset.form==='global'){if(!state.globalInput.trim())return;state.globalReply='可先打开关键测试原事项，查看依据、剩余时间与可用方案。本轮作为讨论保留，未改动正式安排。';render();persist();}});
root.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;const ds=el.dataset;if(ds.nav){navigate(ds.nav);return;}if(ds.open){openItem(ds.open);return;}if(ds.evidence){openItem(ds.evidence,'evidence');return;}if(ds.project){state.project=String(Number(ds.project)+1);render();return;}if(ds.riskFilter){state.riskFilter=ds.riskFilter;render();persist();return;}if(ds.assistantTab){state.assistantTab=ds.assistantTab;state.receipt=null;render();persist();return;}
if(ds.cancelMsg){const m=state.messages.find(x=>x.id===ds.cancelMsg);m.selected=false;m.status='cancelled';state.receipt={title:'本次发送已取消',detail:'后续跟进按你当次说明处理；原事项状态保持。'};render();persist();return;}
if(ds.handoff){const m=state.messages.find(m=>m.id===ds.handoff);if(m?.status!=='failed')return;m.status='manual';render();persist();return;}if(ds.handback){const m=state.messages.find(m=>m.id===ds.handback);if(m?.status!=='manual')return;m.status='failed';state.receipt={title:'本次操作已明确交回助手',detail:'仍有效的原批准沿用；执行前继续核对前提。'};render();persist();return;}if(ds.query){const m=state.messages.find(m=>m.id===ds.query);if(m?.status!=='unknown')return;m.status='sent';state.receipt={title:'模拟查询完成：此前已经发出',detail:'保留原发送事实，本次没有重新发送。'};render();persist();return;}
switch(ds.act){
case 'submit-item':saveItem();return;
case 'submit-global':if(!state.globalInput.trim())return;state.globalReply='可先打开关键测试原事项，查看依据、剩余时间与可用方案。本轮作为讨论保留，未改动正式安排。';render();break;
case 'back-projects':state.project=null;render();break;
case 'open-node':openItem(Number(ds.index)===0?'report':'fixture');break;
case 'open-test':openItem('test');break;
case 'close-sheet':closeSheet();break;
case 'sheet-evidence':readDraft();sheet.mode='evidence';renderSheet();break;
case 'sheet-history':readDraft();sheet.mode='history';renderSheet();break;
case 'sheet-work':sheet.mode='work';renderSheet();break;
case 'dismiss-receipt':state.receipt=null;render();break;
case 'pending-due':readDraft();sheet.due='pending';sheet.dirtyDue=true;renderSheet();break;
case 'attach-image':root.querySelector('#pg-image-input').click();break;
case 'remove-image':readDraft();sheet.image=null;renderSheet();break;
case 'set-time':openItem(ds.id);root.querySelector('#pg-check-date').focus();break;
case 'pending-time':{const i=itemById(ds.id);i.check='pending';i.due='pending';i.version++;state.receipt={title:'已记录：目前都待定',detail:'保留明确待定选择，继续按适用规则复查。',item:i.id};render();break;}
case 'pause':readDraft();{const i=itemById(sheet.id);i.pause=!i.pause;i.version++;i.history.unshift({title:i.pause?'暂停常规提醒':'恢复常规提醒',detail:'不改变具体操作的执行权。'});renderSheet();}break;
case 'reopen':{const i=itemById(sheet.id);i.closed=false;i.need='待继续跟进';i.next='按当前事实确认后续安排';i.version++;i.history.unshift({title:'人工重新打开',detail:'沿用原事项，未重放历史消息。'});state.receipt={title:'原事项已重新打开',detail:'原解除结论与处理历史保留，后续安排需按当前事实核对。',item:i.id};closeSheet(false);state.view='risks';state.riskFilter='active';render();break;}
case 'undo':undo(sheet?.id||ds.id);return;
case 'simulate-conflict':{const i=itemById(sheet.id);i.version++;i.history.unshift({title:'模拟后续有效更新',detail:'同一进展已被后续操作修改。'});sheet.error='已加入一条模拟后续更新。现在撤销应阻止整次操作。';renderSheet();break;}
case 'to-preview':closeSheet(false);state.view='assistant';state.assistantTab='preview';state.receipt=null;render();break;
case 'to-decisions':closeSheet(false);state.view='assistant';state.assistantTab='decisions';state.receipt=null;render();break;
case 'open-batch':state.batchOpen=true;state.batchResult=false;render();break;
case 'open-results':state.batchResult=true;state.batchOpen=false;render();break;
case 'close-batch':state.batchOpen=false;render();break;
case 'send-batch':{const selected=state.messages.filter(m=>m.status==='pending'&&m.selected);if(!selected.length)return;selected.forEach((m,j)=>m.status=design.failure==='混合发送结果'?(j===0?'sent':j===1?'failed':'unknown'):'sent');state.batchResult=true;state.receipt=null;render();break;}
case 'result-back':state.batchResult=false;state.batchOpen=false;state.receipt=null;render();break;
case 'recover-send':state.messages.filter(m=>m.status==='failed').forEach(m=>m.status='sent');state.receipt={title:'模拟故障恢复后完成重试',detail:'仅重试明确未发出且未被你接手的消息；已成功和未知结果不重发。'};render();break;
case 'approve-decision':{
const previous=state.decisionApproved||{adopted:false,sent:false},a=!previous.adopted&&!!root.querySelector('#pg-approve-item')?.checked,b=!previous.sent&&!!root.querySelector('#pg-approve-message')?.checked;
if(!a&&!b){state.receipt={title:'尚未选择新的批准内容',detail:'可继续处理未批准的部分；已有批准不会重复执行。',kind:'warn'};render();return;}
const messageBody=root.querySelector('#pg-decision-message')?.value??state.decisionDraft;
if(b&&!messageBody.trim()){state.receipt={title:'消息正文不能为空',detail:'补齐具体消息后再确认，本次所选内容尚未执行。',kind:'warn'};render();return;}
state.decisionApproved={...previous,adopted:previous.adopted||a,sent:previous.sent||b};
if(b)state.decisionApproved.message={...structuredClone(initialDecisionMessage),body:messageBody,status:'sent',result:'已模拟发送',approvedAt:new Date().toISOString()};
if(a&&!itemById('scope'))state.items.push({id:'scope',title:'工装数据适用范围',project:'微岚执行器',node:'方案验证',need:'需明确适用范围',reason:'两份参数资料适用的版本尚未统一。',next:'核对资料版本和适用范围',priority:'P2',tone:'blue',check:'',clock:'',due:'',closed:false,progress:'资料 A 标注样机版，资料 B 未标注版本。',source:'候选资料 · 虚构示例',version:0,history:[],pause:false,manual:false});
state.decisionSelection={adopt:false,send:false};state.receipt={title:'所选内容已记录（模拟）',detail:`${a?'本次已纳入本地跟进。':previous.adopted?'原纳入记录保留。':'尚未批准纳入，可继续处理。'}${b?'本次编辑后的消息已模拟发送，批准正文可回看。':previous.sent?'原消息批准记录保留，未重复发送。':'尚未发送，可继续预览批准。'}`};render();break;}
}persist();});
root.addEventListener('keydown',e=>{if(!sheet)return;if(e.key==='Escape'){e.preventDefault();closeSheet();return;}if(e.key==='Tab'){const focusable=[...sheetArea.querySelectorAll('button,input,textarea,summary,select')].filter(el=>!el.disabled&&el.getClientRects().length);const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
let observedWidth=0;
const widthObserver=new ResizeObserver(()=>{const width=root.getBoundingClientRect().width;if(Math.abs(width-observedWidth)<1)return;observedWidth=width;root.querySelectorAll('.pg-message-editor').forEach(growMessage);if(sheet){const panel=sheetArea.querySelector('.pg-sheet');if(panel)win.style.minHeight=Math.max(740,panel.getBoundingClientRect().height+68)+'px';}});
widthObserver.observe(root);
render();
if(typeof Tweak!=='undefined'){const tweak=new Tweak({container:root,onChange:()=>{root.style.colorScheme=design.appearance==='浅色'?'light':design.appearance==='深色'?'dark':'light dark';render();persist();}});tweak.addSelect(design,'appearance',{label:'外观',options:['跟随系统','浅色','深色']});tweak.addSlider(design,'glass',{label:'玻璃底色浓度',min:55,max:95,unit:'%'});tweak.addSlider(design,'radius',{label:'内容圆角',min:12,max:26,unit:'px'});tweak.addSelect(design,'density',{label:'内容留白',options:['舒适','紧凑']});tweak.addSelect(design,'failure',{label:'体验结果分支',options:['正常结果','保存失败','保存结果未知','混合发送结果']});}
})();
</script>
